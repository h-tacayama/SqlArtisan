name: Integration Tests

# Real-database integration matrix (#151). Each engine runs SqlArtisan-built
# statements against a live database (Testcontainers; SQLite is in-process), so
# CI catches grammar/semantic bugs only the engine itself rejects — the kind the
# exact-SQL unit tests cannot. Kept off the per-PR fast loop (ci.yml): the unit
# tests are the inner loop; these gate releases (called by release.yml) and run
# nightly, with on-demand dispatch.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    strategy:
      # One engine per job, in parallel; a failure in one (e.g. the heavy Oracle
      # lane) must not cancel the others — each engine's result stands alone.
      fail-fast: false
      matrix:
        # Oracle23ai is a second, narrower Oracle lane (#263): it live-proves
        # the analyzer's version-bound entries at 23ai rather than repeating
        # the full sweep, so it pays the same heavy image start as Oracle but
        # runs only a handful of statements.
        engine: [Sqlite, PostgreSql, MySql, SqlServer, Oracle, Oracle23ai]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          # Pinned by global.json so every environment resolves the same SDK
          # feature band (analyzer/format behavior differs across bands).
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/SqlArtisan.IntegrationTests/SqlArtisan.IntegrationTests.csproj

      - name: Test (${{ matrix.engine }})
        run: |
          set -o pipefail
          dotnet test tests/SqlArtisan.IntegrationTests \
            -c Release \
            --filter "Engine=${{ matrix.engine }}" \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/test.log

      # TEMPORARY (#523 item 2): job logs are unreachable from the authoring
      # container, so the probe report is re-emitted as a workflow annotation,
      # which the check-runs API does serve. Removed with the probe itself.
      - name: Probe report
        if: always()
        run: |
          python3 - <<'PY'
          import re
          text = open('/tmp/test.log', encoding='utf-8', errors='replace').read()
          m = re.search(r'#523 item 2 probe.*?(?=\n\s*Stack Trace)', text, re.S)
          body = m.group(0) if m else 'NO PROBE REPORT FOUND'
          enc = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=probe::' + enc[:4000])
          PY
